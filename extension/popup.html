<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Saver</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 300px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #eaeaea;
            padding: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .logo-text {
            font-size: 15px;
            font-weight: 600;
            color: #f5f5f5;
        }

        /* Login form */
        #loginForm {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: #a1a1aa;
        }

        input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #262626;
            color: #f5f5f5;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        input::placeholder {
            color: #666;
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        #loginButton {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            margin-top: 4px;
        }

        #loginButton:hover {
            opacity: 0.9;
        }

        .error {
            font-size: 12px;
            color: #f87171;
            display: none;
        }

        /* Link fields */
        #linkFields {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 14px;
        }

        /* Save link state */
        #saveLink {
            display: none;
            width: 100%;
            background: #262626;
            color: #f5f5f5;
            border: 1px solid #333;
            padding: 14px 16px;
            font-size: 13px;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #saveLink:hover {
            background: #2e2e2e;
            border-color: #8b5cf6;
        }

        #saveLink.saved {
            background: #14532d;
            border-color: #16a34a;
            color: #86efac;
        }

        .current-url {
            font-size: 11px;
            color: #71717a;
            margin-top: 10px;
            text-align: center;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="logo">
        <div class="logo-icon">L</div>
        <div class="logo-text">Link Saver</div>
    </div>

    <form id="loginForm">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="error" id="loginError">Invalid email or password</div>

        <button type="submit" id="loginButton">Log In</button>
    </form>

    <div id="linkFields">
        <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="What's this link about?">
        </div>

        <div class="field">
            <label for="note">Note</label>
            <input type="text" id="note" placeholder="e.g. 19/20">
        </div>

        <div class="field">
            <label for="tags">Tags</label>
            <input type="text" id="tags" placeholder="comma, separated, tags">
        </div>
    </div>

    <button id="saveLink">Save This Link</button>
    <div class="current-url" id="currentUrl"></div>

    <script src="popup.js"></script>
    <script src="login.js"></script>

</body>
</html>
